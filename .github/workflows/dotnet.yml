name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MSBUILDDISABLENODEREUSE: "1"

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Check Expr.generated.cs is up to date
      run: |
        dotnet tool restore
        dotnet t4 Source/Expr.tt -o "$RUNNER_TEMP/Expr"
        # Ignore the BOM and line endings, which depend on the editor and on git settings.
        diff <(sed 's/^\xEF\xBB\xBF//; s/\r$//' Source/Expr.generated.cs) <(sed 's/^\xEF\xBB\xBF//; s/\r$//' "$RUNNER_TEMP/Expr.generated.cs")
    - name: Restore
      run: dotnet restore Linq.Expressions.Deconstruct.slnx
    - name: Build
      run: dotnet build Linq.Expressions.Deconstruct.slnx -c Release --no-restore -nodeReuse:false
    - name: Check packaged skill
      run: |
        python3 -m unittest discover -s Tests -p 'test_skill_package.py'
        dotnet pack Source/Linq.Expressions.Deconstruct.csproj -c Release --no-build --no-restore -nodeReuse:false -o "$RUNNER_TEMP/skill-package"
        python3 Tests/check_skill_package.py "$RUNNER_TEMP"/skill-package/*.nupkg
    - name: Test
      run: dotnet test Linq.Expressions.Deconstruct.slnx -c Release --no-build
