name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Restore
      run: dotnet restore Linq.Expressions.Deconstruct.slnx
    - name: Build
      run: dotnet build Linq.Expressions.Deconstruct.slnx -c Release --no-restore
    - name: Test
      run: dotnet test Linq.Expressions.Deconstruct.slnx -c Release --no-build
